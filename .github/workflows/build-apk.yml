name: Build Android APK

on:
  push:
    paths:
      - 'game/**'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'game/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # attach the APK to a GitHub Release on v* tags

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      # Optional: sign with your own key so every new APK installs over the
      # previous one. Add these repository secrets to turn it on:
      #   ANDROID_KEYSTORE_BASE64  (base64 of your .jks file)
      #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Without them the APK is signed with a throwaway debug key.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets set: building with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Release signing enabled."

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name the APK
        id: apk
        run: |
          name="combat-game-${GITHUB_REF_NAME//\//-}-${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/$name"
          echo "path=game/build/$name" >> "$GITHUB_OUTPUT"
          ls -lh "build/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: combat-game-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
